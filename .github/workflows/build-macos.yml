name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal macOS app
        run: npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: Zip app bundle
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent stageclock.app stageclock-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: stageclock-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/stageclock-macos.zip

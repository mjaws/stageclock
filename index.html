<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StageClock</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main id="app">
      <div id="controls">
        <div class="mode-switch" role="group" aria-label="Clock mode">
          <button type="button" class="mode-btn" data-mode="clock">Clock</button>
          <button type="button" class="mode-btn" data-mode="countdown">Countdown</button>
          <button type="button" class="mode-btn" data-mode="stopwatch">Stopwatch</button>
        </div>

        <div class="timer-controls">
          <input
            id="duration-input"
            type="text"
            inputmode="numeric"
            placeholder="MM:SS"
            aria-label="Countdown duration"
          />
          <div class="nudge-group hidden" id="nudge-controls">
            <button type="button" id="nudge-minus-btn" aria-label="Subtract from countdown">−</button>
            <select id="nudge-amount" aria-label="Adjustment amount">
              <option value="5000">5s</option>
              <option value="10000">10s</option>
              <option value="30000" selected>30s</option>
              <option value="60000">1m</option>
              <option value="300000">5m</option>
            </select>
            <button type="button" id="nudge-plus-btn" aria-label="Add to countdown">+</button>
          </div>
          <button type="button" id="confirm-edit-btn" class="hidden">Confirm</button>
          <button type="button" id="cancel-edit-btn" class="hidden">Cancel</button>
          <button type="button" id="start-btn">Start</button>
          <button type="button" id="pause-btn">Pause</button>
          <button type="button" id="reset-btn">Reset</button>
        </div>

        <div class="popout-controls">
          <button type="button" id="save-btn" disabled>Save</button>
          <span id="audience-readout">Audience: —</span>
          <button type="button" id="popout-btn">Open popout</button>
          <button type="button" id="popout-fullscreen-btn" disabled>Fullscreen</button>
          <button type="button" id="popout-chrome-btn" disabled>Toggle toolbar</button>
          <button type="button" id="popout-ontop-btn" disabled>On top</button>
          <label class="opacity-group" for="popout-opacity">
            Background
            <input
              type="range"
              id="popout-opacity"
              min="0"
              max="100"
              value="100"
              disabled
              aria-label="Popout background opacity"
            />
          </label>
        </div>

        <button type="button" id="chrome-toggle-btn" title="Hide toolbar (F9)">
          Hide toolbar
        </button>
      </div>

      <div id="stage">
        <div id="display" class="band-neutral">00:00:00</div>
      </div>

      <div id="hint">Press F9 to show the toolbar again</div>
    </main>
  </body>
</html>
